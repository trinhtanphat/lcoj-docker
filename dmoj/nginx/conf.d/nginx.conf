server {
    listen       80;
    listen       [::]:80;
    server_name  luyencode.net;
    client_max_body_size 64M;

    add_header X-UA-Compatible "IE=Edge,chrome=1";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;
    try_files $uri @icons;
    error_page 502 504 /502.html;

    location ~ ^/502\.html$|^/logo\.png$|^/robots\.txt$ {
        root /assets/;
    }

    location /assets/ {
        root /cppro_frontend;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /data/ {
        root /cppro_frontend;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /manifests/ {
        root /cppro_frontend;
        expires max;
        try_files $uri =404;
    }

    location = /problem-package-template.zip {
        root /cppro_frontend;
        expires max;
        try_files $uri =404;
    }

    location = / {
        root /cppro_frontend;
        add_header Cache-Control "no-cache";
        try_files /index.html @uwsgi;
    }

    # The CPPro bridge is an authenticated Django API, never a frontend asset
    # or the icon fallback used by the legacy installation.
    location ^~ /api/ {
        try_files $uri @uwsgi;
    }

    # /admin/ remains Django. Localized /management is a CPPro SPA route,
    # deliberately separate from the legacy administration site.
    location ~ ^/(vi|en)/(admin|api|accounts|channels|event|i18n|impersonate|judge-select2|martor|media|newsletter|old_oj_media|pdf|static|submission_file|tasks|widgets)(/.*)?$ {
        try_files $uri @uwsgi;
    }

    location ~ ^/(vi|en)(/.*)?$ {
        root /cppro_frontend;
        add_header Cache-Control "no-cache";
        try_files /index.html @uwsgi;
    }

    location ~ ^/(problems|contests|organizations|users|submissions|submission|posts|status|runtimes)(/.*)?$ {
        root /cppro_frontend;
        add_header Cache-Control "no-cache";
        try_files /index.html @uwsgi;
    }

    location @icons {
        root /assets/resources/icons/;
        log_not_found off;
        error_page 403 = @uwsgi;
        error_page 404 = @uwsgi;
    }

    location @uwsgi {
        uwsgi_read_timeout 600;
        uwsgi_pass site:8000;
        include uwsgi_params;
        uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
    }

    location /static {
        gzip_static on;
        expires max;
        root /assets/;
    }

    location /martor {
        root /media/;
    }

    location /old_oj_media {
        root /media/;
    }

    location /pdf {
        root /media/;
    }

    location /submission_file {
        root /media/;
    }

    location /userdatacache {
        internal;
        root /;
    }

    location /contestdatacache {
        internal;
        root /;
    }

    location /event/ {
        proxy_pass http://wsevent:15100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /channels/ {
        proxy_read_timeout 120;
        proxy_pass http://wsevent:15102/;
    }
}
