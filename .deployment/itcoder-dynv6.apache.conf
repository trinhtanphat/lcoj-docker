<VirtualHost *:80>
    ServerName itcoder.dynv6.net

    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:18083/ connectiontimeout=5 timeout=300 retry=0
    ProxyPassReverse / http://127.0.0.1:18083/

    ErrorLog ${APACHE_LOG_DIR}/itcoder-dmoj-error.log
    CustomLog ${APACHE_LOG_DIR}/itcoder-dmoj-access.log combined
</VirtualHost>
